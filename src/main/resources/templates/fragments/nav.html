<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!--/* Shared favicon set, included via th:replace in every page's <head>. */-->
    <th:block th:fragment="favicon">
        <link rel="icon" href="/img/favicon.svg" type="image/svg+xml"/>
        <link rel="alternate icon" href="/img/favicon-32.png" type="image/png" sizes="32x32"/>
        <link rel="alternate icon" href="/img/favicon-16.png" type="image/png" sizes="16x16"/>
        <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" sizes="180x180"/>
        <meta name="theme-color" content="#0d9488"/>
    </th:block>
</head>
<body>
<div th:fragment="topbar" class="topbar no-print">
    <div class="brand">
        <img src="/img/favicon.svg" alt="Sunrise Dental Clinic logo" class="brand-logo"/>
        <span>Sunrise Dental Clinic</span>
    </div>
    <nav>
        <a th:href="@{/dashboard}">Menu</a>
        <a th:href="@{/appointments/new}">Register</a>
        <a th:href="@{/appointments/search}">Find Appointment</a>
        <a th:href="@{/notices}">Noticeboard</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/reports}">Reports</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/settings}">Settings</a>
        <a th:href="@{/help}">Help</a>

        <details class="notif-bell">
            <summary>
                🔔
                <span class="notif-count" th:if="${staffNotificationCount != null and staffNotificationCount > 0}"
                      th:text="${staffNotificationCount > 9 ? '9+' : staffNotificationCount}"></span>
            </summary>
            <div class="notif-dropdown">
                <div class="notif-dropdown-header">Recent Activity</div>
                <div class="notif-item" th:each="n : ${recentStaffNotifications}">
                    <p th:text="${n.message}"></p>
                    <span th:text="${#temporals.format(n.createdAt, 'dd MMM HH:mm')}"></span>
                </div>
                <p class="notif-empty" th:if="${recentStaffNotifications == null or recentStaffNotifications.isEmpty()}">No activity yet.</p>
            </div>
        </details>

        <span class="user-chip" sec:authentication="name">user</span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" id="btnLogout" class="logout-link">Logout</button>
        </form>
    </nav>
</div>
</body>
</html>
