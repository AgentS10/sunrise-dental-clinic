<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 950" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1e3a5f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1300" height="950" fill="#ffffff"/>

  <!-- Clients -->
  <rect x="420" y="20" width="460" height="60" rx="10" fill="#eef2f4" stroke="#1e3a5f" stroke-width="1.6"/>
  <text x="650" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a5f">Clients</text>
  <text x="650" y="66" text-anchor="middle" font-size="12.5" fill="#334155">Browser (staff) &#8226; curl / Postman / external systems (REST)</text>

  <line x1="580" y1="80" x2="580" y2="120" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="80" x2="740" y2="120" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Tier 1: Presentation -->
  <rect x="60" y="120" width="1180" height="140" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="90" y="148" font-size="15" font-weight="700" fill="#0b3d3a">Presentation Tier</text>

  <rect x="120" y="165" width="480" height="75" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/>
  <text x="360" y="190" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b3d3a">web.* — Thymeleaf MVC Controllers</text>
  <text x="360" y="210" text-anchor="middle" font-size="12" fill="#334155">Session/cookie form login &#183; server-rendered staff UI</text>
  <text x="360" y="227" text-anchor="middle" font-size="12" fill="#334155">AppointmentWebController, ReportWebController, HomeController</text>

  <rect x="700" y="165" width="480" height="75" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/>
  <text x="940" y="190" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b3d3a">api.* — REST Controllers (JSON web services)</text>
  <text x="940" y="210" text-anchor="middle" font-size="12" fill="#334155">Stateless HTTP Basic auth &#183; independent client access</text>
  <text x="940" y="227" text-anchor="middle" font-size="12" fill="#334155">AppointmentApiController, ReportApiController, LookupApiController</text>

  <line x1="580" y1="260" x2="580" y2="300" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="260" x2="740" y2="300" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Tier 2: Business logic -->
  <rect x="60" y="300" width="1180" height="330" rx="10" fill="#f2f7ff" stroke="#3457a6" stroke-width="2"/>
  <text x="90" y="328" font-size="15" font-weight="700" fill="#1f3a75">Business Logic Tier</text>

  <rect x="410" y="345" width="480" height="50" rx="8" fill="#ffffff" stroke="#3457a6" stroke-width="1.4"/>
  <text x="650" y="375" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f3a75">ClinicFacade  &#171;Facade&#187;</text>

  <line x1="650" y1="395" x2="650" y2="420" stroke="#1e3a5f" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="120" y="420" width="1060" height="55" rx="8" fill="#ffffff" stroke="#3457a6" stroke-width="1.2"/>
  <text x="650" y="452" text-anchor="middle" font-size="13" fill="#1f3a75">AppointmentService &#8226; BillingService &#8226; PatientService &#8226; ReportService</text>

  <line x1="650" y1="475" x2="650" y2="500" stroke="#1e3a5f" stroke-width="1.4" marker-end="url(#arrow)"/>

  <text x="650" y="520" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f3a75">service.pattern.* — design patterns backing the services above</text>

  <g font-size="12" fill="#1f3a75">
    <rect x="90"  y="535" width="185" height="70" rx="8" fill="#fffaf0" stroke="#b98900" stroke-width="1.2"/>
    <text x="182" y="558" text-anchor="middle" font-weight="600">Singleton</text>
    <text x="182" y="575" text-anchor="middle" font-size="11">AppointmentNumber-</text>
    <text x="182" y="589" text-anchor="middle" font-size="11">Generator</text>

    <rect x="290" y="535" width="185" height="70" rx="8" fill="#fffaf0" stroke="#b98900" stroke-width="1.2"/>
    <text x="382" y="558" text-anchor="middle" font-weight="600">Strategy + Factory</text>
    <text x="382" y="575" text-anchor="middle" font-size="11">BillingStrategy /</text>
    <text x="382" y="589" text-anchor="middle" font-size="11">BillingStrategyFactory</text>

    <rect x="490" y="535" width="185" height="70" rx="8" fill="#fffaf0" stroke="#b98900" stroke-width="1.2"/>
    <text x="582" y="558" text-anchor="middle" font-weight="600">Builder</text>
    <text x="582" y="575" text-anchor="middle" font-size="11">BillBuilder</text>

    <rect x="690" y="535" width="185" height="70" rx="8" fill="#fffaf0" stroke="#b98900" stroke-width="1.2"/>
    <text x="782" y="558" text-anchor="middle" font-weight="600">Observer</text>
    <text x="782" y="575" text-anchor="middle" font-size="11">AppointmentEventPublisher</text>
    <text x="782" y="589" text-anchor="middle" font-size="11">+ 2 observers</text>

    <rect x="890" y="535" width="185" height="70" rx="8" fill="#fffaf0" stroke="#b98900" stroke-width="1.2"/>
    <text x="982" y="558" text-anchor="middle" font-weight="600">Factory Method</text>
    <text x="982" y="575" text-anchor="middle" font-size="11">ReportFactory / Report</text>
  </g>

  <line x1="580" y1="630" x2="580" y2="670" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="630" x2="740" y2="670" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Tier 3: Data access -->
  <rect x="60" y="670" width="1180" height="130" rx="10" fill="#fff5f5" stroke="#b3423a" stroke-width="2"/>
  <text x="90" y="698" font-size="15" font-weight="700" fill="#7a231d">Data Access Tier</text>

  <rect x="120" y="715" width="1060" height="55" rx="8" fill="#ffffff" stroke="#b3423a" stroke-width="1.2"/>
  <text x="650" y="748" text-anchor="middle" font-size="13" fill="#7a231d">repository.* — Spring Data JPA repositories &#171;DAO&#187; (7 interfaces, one per entity)</text>

  <line x1="650" y1="800" x2="650" y2="830" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Database -->
  <g transform="translate(650,860)">
    <ellipse cx="0" cy="0" rx="120" ry="18" fill="#eef2f4" stroke="#1e3a5f" stroke-width="1.6"/>
    <path d="M -120,0 L -120,40 A 120,18 0 0 0 120,40 L 120,0" fill="#eef2f4" stroke="#1e3a5f" stroke-width="1.6"/>
    <ellipse cx="0" cy="40" rx="120" ry="18" fill="none" stroke="#1e3a5f" stroke-width="1.6"/>
    <text x="0" y="10" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a5f">H2 Database</text>
    <text x="0" y="28" text-anchor="middle" font-size="11" fill="#1e3a5f">(file-based)</text>
  </g>
  <text x="650" y="925" text-anchor="middle" font-size="11.5" fill="#64748b">Swappable for MySQL / PostgreSQL via one datasource property — no code changes</text>
</svg>
