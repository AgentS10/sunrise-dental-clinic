<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="openArrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1e3a5f" stroke-width="1.4"/>
    </marker>
    <marker id="hollowTriangle" markerWidth="18" markerHeight="14" refX="14" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 Z" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>

  <!-- System boundary -->
  <rect x="290" y="40" width="900" height="800" rx="10" fill="#f7fbfb" stroke="#0b3d3a" stroke-width="2"/>
  <text x="740" y="70" text-anchor="middle" font-size="20" font-weight="700" fill="#0b3d3a">Sunrise Dental Clinic System</text>

  <!-- ===== Actors ===== -->
  <!-- Receptionist -->
  <g transform="translate(110,330)">
    <circle cx="0" cy="10" r="14" fill="#ffffff" stroke="#1e3a5f" stroke-width="2.2"/>
    <line x1="0" y1="24" x2="0" y2="70" stroke="#1e3a5f" stroke-width="2.2"/>
    <line x1="-24" y1="38" x2="24" y2="38" stroke="#1e3a5f" stroke-width="2.2"/>
    <line x1="0" y1="70" x2="-20" y2="105" stroke="#1e3a5f" stroke-width="2.2"/>
    <line x1="0" y1="70" x2="20" y2="105" stroke="#1e3a5f" stroke-width="2.2"/>
    <text x="0" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#0b3d3a">Receptionist</text>
  </g>

  <!-- Administrator -->
  <g transform="translate(110,650)">
    <circle cx="0" cy="10" r="14" fill="#ffffff" stroke="#1e3a5f" stroke-width="2.2"/>
    <line x1="0" y1="24" x2="0" y2="70" stroke="#1e3a5f" stroke-width="2.2"/>
    <line x1="-24" y1="38" x2="24" y2="38" stroke="#1e3a5f" stroke-width="2.2"/>
    <line x1="0" y1="70" x2="-20" y2="105" stroke="#1e3a5f" stroke-width="2.2"/>
    <line x1="0" y1="70" x2="20" y2="105" stroke="#1e3a5f" stroke-width="2.2"/>
    <text x="0" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#0b3d3a">Administrator</text>
  </g>

  <!-- Secondary external actor: Notification Gateway -->
  <g transform="translate(1290,370)">
    <circle cx="0" cy="10" r="14" fill="#ffffff" stroke="#5b6b79" stroke-width="2.2" stroke-dasharray="3,2"/>
    <line x1="0" y1="24" x2="0" y2="70" stroke="#5b6b79" stroke-width="2.2"/>
    <line x1="-24" y1="38" x2="24" y2="38" stroke="#5b6b79" stroke-width="2.2"/>
    <line x1="0" y1="70" x2="-20" y2="105" stroke="#5b6b79" stroke-width="2.2"/>
    <line x1="0" y1="70" x2="20" y2="105" stroke="#5b6b79" stroke-width="2.2"/>
    <text x="0" y="128" text-anchor="middle" font-size="13" fill="#5b6b79">SMS Gateway</text>
    <text x="0" y="144" text-anchor="middle" font-size="11" fill="#5b6b79">(simulated)</text>
  </g>

  <!-- ===== Use case ellipses ===== -->
  <!-- Primary use cases -->
  <g id="uc-login">
    <ellipse cx="460" cy="110" rx="115" ry="34" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
    <text x="460" y="115" text-anchor="middle" font-size="14" fill="#0b3d3a">Login</text>
  </g>
  <g id="uc-register">
    <ellipse cx="460" cy="210" rx="130" ry="36" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
    <text x="460" y="207" text-anchor="middle" font-size="14" fill="#0b3d3a">Register New</text>
    <text x="460" y="223" text-anchor="middle" font-size="14" fill="#0b3d3a">Appointment</text>
  </g>
  <g id="uc-search">
    <ellipse cx="460" cy="320" rx="130" ry="36" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
    <text x="460" y="317" text-anchor="middle" font-size="14" fill="#0b3d3a">Display Appointment</text>
    <text x="460" y="333" text-anchor="middle" font-size="14" fill="#0b3d3a">Details</text>
  </g>
  <g id="uc-bill">
    <ellipse cx="460" cy="430" rx="130" ry="36" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
    <text x="460" y="427" text-anchor="middle" font-size="14" fill="#0b3d3a">Calculate &amp; Print</text>
    <text x="460" y="443" text-anchor="middle" font-size="14" fill="#0b3d3a">Bill</text>
  </g>
  <g id="uc-reports">
    <ellipse cx="460" cy="540" rx="115" ry="34" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
    <text x="460" y="545" text-anchor="middle" font-size="14" fill="#0b3d3a">View Reports</text>
  </g>
  <g id="uc-help">
    <ellipse cx="460" cy="640" rx="115" ry="34" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
    <text x="460" y="645" text-anchor="middle" font-size="14" fill="#0b3d3a">View Help</text>
  </g>
  <g id="uc-logout">
    <ellipse cx="460" cy="740" rx="115" ry="34" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
    <text x="460" y="745" text-anchor="middle" font-size="14" fill="#0b3d3a">Logout</text>
  </g>

  <!-- Included / extended use cases -->
  <g id="uc-validate">
    <ellipse cx="850" cy="150" rx="128" ry="34" fill="#fffaf0" stroke="#b98900" stroke-width="1.6"/>
    <text x="850" y="147" text-anchor="middle" font-size="13" fill="#5c4300">Validate Appointment</text>
    <text x="850" y="163" text-anchor="middle" font-size="13" fill="#5c4300">Input</text>
  </g>
  <g id="uc-doublebook">
    <ellipse cx="850" cy="230" rx="128" ry="34" fill="#fffaf0" stroke="#b98900" stroke-width="1.6"/>
    <text x="850" y="227" text-anchor="middle" font-size="13" fill="#5c4300">Prevent Double-</text>
    <text x="850" y="243" text-anchor="middle" font-size="13" fill="#5c4300">Booking</text>
  </g>
  <g id="uc-notify">
    <ellipse cx="850" cy="310" rx="128" ry="34" fill="#fffaf0" stroke="#b98900" stroke-width="1.6"/>
    <text x="850" y="307" text-anchor="middle" font-size="13" fill="#5c4300">Send Appointment</text>
    <text x="850" y="323" text-anchor="middle" font-size="13" fill="#5c4300">Notification</text>
  </g>
  <g id="uc-discount">
    <ellipse cx="850" cy="430" rx="128" ry="34" fill="#f2f7ff" stroke="#3457a6" stroke-width="1.6"/>
    <text x="850" y="427" text-anchor="middle" font-size="13" fill="#1f3a75">Apply Loyalty</text>
    <text x="850" y="443" text-anchor="middle" font-size="13" fill="#1f3a75">Discount</text>
  </g>

  <!-- ===== Associations: Receptionist ===== -->
  <line x1="140" y1="360" x2="345" y2="120" stroke="#1e3a5f" stroke-width="1.4"/>
  <line x1="140" y1="380" x2="330" y2="210" stroke="#1e3a5f" stroke-width="1.4"/>
  <line x1="140" y1="400" x2="330" y2="320" stroke="#1e3a5f" stroke-width="1.4"/>
  <line x1="140" y1="410" x2="330" y2="430" stroke="#1e3a5f" stroke-width="1.4"/>
  <line x1="140" y1="420" x2="345" y2="640" stroke="#1e3a5f" stroke-width="1.4"/>
  <line x1="140" y1="430" x2="345" y2="740" stroke="#1e3a5f" stroke-width="1.4"/>

  <!-- ===== Associations: Administrator ===== -->
  <line x1="140" y1="650" x2="345" y2="540" stroke="#1e3a5f" stroke-width="1.4"/>
  <!-- Generalization: Administrator --|> Receptionist -->
  <line x1="110" y1="650" x2="110" y2="460" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#hollowTriangle)"/>

  <!-- ===== include / extend relationships ===== -->
  <line x1="586" y1="195" x2="722" y2="160" stroke="#b98900" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="660" y="165" font-size="11" fill="#8a5a00">&#171;include&#187;</text>

  <line x1="588" y1="222" x2="722" y2="230" stroke="#b98900" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="655" y="222" font-size="11" fill="#8a5a00">&#171;include&#187;</text>

  <line x1="588" y1="235" x2="722" y2="300" stroke="#b98900" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="640" y="278" font-size="11" fill="#8a5a00">&#171;include&#187;</text>

  <line x1="978" y1="310" x2="1240" y2="380" stroke="#5b6b79" stroke-width="1.4"/>

  <line x1="588" y1="425" x2="722" y2="430" stroke="#3457a6" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="655" y="418" font-size="11" fill="#1f3a75">&#171;extend&#187;</text>

  <!-- Legend -->
  <g transform="translate(320,790)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#1e3a5f" stroke-width="1.4"/>
    <text x="34" y="4" font-size="12" fill="#333">Association</text>

    <line x1="150" y1="0" x2="176" y2="0" stroke="#b98900" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
    <text x="184" y="4" font-size="12" fill="#333">&#171;include&#187; / &#171;extend&#187;</text>

    <line x1="420" y1="0" x2="446" y2="0" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#hollowTriangle)"/>
    <text x="454" y="4" font-size="12" fill="#333">Generalization</text>
  </g>
</svg>
